<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Dynamic Task Manager</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="container">
        <h1>Secure Dynamic Task Manager</h1>

        <section class="task-form">
            <label for="taskInput">Task</label>

            <div class="input-row">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter a task"
                >

                <button type="button" id="addTaskBtn">
                    Add Task
                </button>

                <button type="button" id="loadSamplesBtn">
                    Load Sample Tasks
                </button>
            </div>

            <p id="taskMessage" class="task-message"></p>
        </section>

        <section class="summary">
            <div>
                <span>Total Tasks</span>
                <strong id="totalCount">0</strong>
            </div>

            <div>
                <span>Pending</span>
                <strong id="pendingCount">0</strong>
            </div>

            <div>
                <span>Completed</span>
                <strong id="completedCount">0</strong>
            </div>
        </section>

        <section class="task-section">
            <h2>Tasks</h2>

            <ul id="taskList"></ul>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
